dataset_name: "ViTextVQA"
data_dir: "./datasets"
# Công tắc module (notebook ghi đè qua biến môi trường): QA-ViT, Consformer, TWC.
ablation_use_image: true
ablation_use_qaclip: false   # dùng qavit_mode ở dưới
qavit_mode: "no_question"    # off = CLIP thường | no_question = adapter QA-ViT học, câu hỏi rỗng (code trước refactor) | question = QA-ViT đầy đủ
ablation_use_ocr: true       # Consformer · false = OCR text-only
ocr_feature_norm: "layernorm"   # Consformer như code trước refactor
# TWC như TWA: bản OCR related (tăng cường TWA = OCR Augmentation) đứng sau bản gốc trong input
# encoder, mỗi bản qua Consformer riêng; loss BCE hai chiều trên đầu ra encoder. Bản related có
# ở cả train và test (cùng quy trình); chỉ khi train mới có loss.
use_twc: false
twc_weight: 1.0
twc_adv_probability: 0.6     # TWA adv_pro: xác suất một từ của bản related bị đổi; notebook: TWC_AUG_P
twc_temperature_init: 0.07   # τ CỐ ĐỊNH (không học); notebook: TWC_TAU
ocr_related_remove_layout: true   # bản related không có box, det, rec (con_remove_bbox của TWA + bỏ đặc trưng vùng)

output_dir: "./output/finetune"
logging_dir: "./output/finetune/logs"
model_name_or_path: null # Optional OpenViVQA checkpoint; null initializes the backbones.
resume_from_checkpoint: null
resume_checkpoint_id: ""

seed: 42
num_train_epochs: 5
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 1   # notebook: BATCH_SIZE, GRAD_ACCUM
learning_rate: 0.00003                 # phần đã pretrain (ViT5, projection của QA-ViT)
new_module_learning_rate: 0.0001       # module khởi tạo ngẫu nhiên (ConsFormer, embedding OCR/ký tự): ~3x, như M4C/TWA
scalar_learning_rate: 0.001            # gate QA-ViT, không weight decay (temperature TWC cố định)
weight_decay: 0.1
warmup_ratio: 0.1
lr_scheduler_type: "cosine"

logging_steps: 100
eval_strategy: "epoch"
save_strategy: "epoch"
save_total_limit: 2

# Đặt tự động theo dataset trong training/finetune.py: ViTextVQA/ViOCRVQA → em_f1
# (trung bình EM và F1 trên val), OpenViVQA → cider. Không chọn theo loss.
metric_for_best_model: "em_f1"
greater_is_better: true
load_best_model_at_end: true
remove_unused_columns: false
predict_with_generate: true

# 0 = CE thường, khớp công thức của run Vast cũ (code cũ bỏ qua giá trị này) để so sánh công bằng.
label_smoothing_factor: 0.1
optim: "adamw_torch"
dataloader_num_workers: 4
dataloader_pin_memory: true
disable_tqdm: false
fp16: false
report_to: "none"

generation_max_length: 56
generation_num_beams: 4
