dataset_name: "ViTextVQA"
data_dir: "./datasets"
vocab_path: "configs/data/term_vocab.txt"
viet_vocab_path: "configs/data/viet_vocab.jsonl"

loss_ablation_mode: "all"
ablation_use_qaclip: true
ablation_use_vs: true
ablation_use_ocr: true

output_dir: "./output/finetune"
logging_dir: "./output/finetune/logs"
model_name_or_path: "./output/pretrain_ckpt_base"  # Hoặc thư mục output của bước pretrain
resume_from_checkpoint: null  # Đường dẫn local tới thư mục checkpoint (vd: "./output/finetune/checkpoint-500") để resume.
resume_checkpoint_id: ""      # Google Drive ID của file zip chứa checkpoint finetune để resume.

seed: 42
num_train_epochs: 10
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 0.00003
weight_decay: 0.1
warmup_ratio: 0.1
lr_scheduler_type: "cosine"
logging_steps: 100
eval_strategy: "epoch"
save_strategy: "epoch"
save_total_limit: 4
metric_for_best_model: "loss"
greater_is_better: false
load_best_model_at_end: true
remove_unused_columns: false
predict_with_generate: true
dataloader_num_workers: 4
dataloader_pin_memory: true
fp16: false
