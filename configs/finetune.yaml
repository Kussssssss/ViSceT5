dataset_name: "ViTextVQA"
data_dir: "./datasets"
vocab_path: "configs/data/term_vocab.txt"
viet_vocab_path: "configs/data/viet_vocab.txt"

loss_ablation_mode: "all"
# 4 ablation ĐỘC LẬP cho finetune (bật/tắt từng cái để đánh giá khách quan):
ablation_use_qaclip: true    # (1) Late-fusion QACLIP
ablation_use_vs: true        # (2) Visual Search (crop)
ablation_use_ocr: true       # (3) OCR Consformer
ablation_use_ocr_aug: true   # (4) OCR augmentation (correct/noise/keep → nối bản OCR augment cạnh OCR gốc)

output_dir: "./output/finetune"
logging_dir: "./output/finetune/logs"
model_name_or_path: null # Hoặc thư mục output của bước pretrain (nếu finetune wo pretrain thì để null)
resume_from_checkpoint: null
resume_checkpoint_id: ""

seed: 42
num_train_epochs: 5
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 0.00003
weight_decay: 0.1
warmup_ratio: 0.1
lr_scheduler_type: "cosine"

logging_steps: 100
eval_strategy: "epoch"
save_strategy: "epoch"
save_total_limit: 2   # đĩa Kaggle ~20GB; mỗi checkpoint ~4.5GB. Giữ best+latest.
                      # override bằng env SAVE_TOTAL_LIMIT nếu cần.

# metric_for_best_model / greater_is_better được ĐẶT TỰ ĐỘNG theo dataset trong
# training/finetune.py: ViTextVQA & ViOCRVQA → "em"; OpenViVQA → "cider" (cần java);
# cả hai greater_is_better=true. Hai dòng dưới chỉ là mặc định dự phòng, sẽ bị ghi đè.
# Ghi đè thủ công bằng env METRIC_FOR_BEST_MODEL nếu cần.
metric_for_best_model: "loss"
greater_is_better: false
load_best_model_at_end: true
remove_unused_columns: false
predict_with_generate: true

label_smoothing_factor: 0.1
optim: "adamw_torch"
dataloader_num_workers: 4
dataloader_pin_memory: true
disable_tqdm: false
fp16: false
report_to: "none"

generation_max_length: 56
generation_num_beams: 4
