dataset_name: "ViTextVQA"
data_dir: "./datasets"
# Bật ConsFormer với GroupAttention đã sửa, OCR augmentation và TWC.
ablation_use_image: true
ablation_use_qaclip: false   # dùng qavit_mode ở dưới
ablation_use_ocr: true
ablation_use_consformer: true # GroupAttention đã khớp công thức gốc
ablation_use_ocr_aug: true
ocr_related: "augment"         # bản related (dùng chung OCR-Aug, ConsFormer, TWC; train = test): augment = keep/correct/noise theo twc_adv_probability; correct = chỉ sửa
ocr_aug_mode: "separate"      # hai lượt ConsFormer riêng; concat toàn bộ Origin + Related rồi cộng feature OCR
qavit_mode: "off"   # off | no_question | question — CLIP thường (các run TWC t1–t11)
ocr_feature_norm: "layernorm"   # Consformer như code trước refactor (run Vast); rmsnorm = bản refactor
use_twc: true
twc_weight: 1.0
twc_temperature_init: 0.2     # tau khởi tạo; học log(1/tau) qua gradient
twc_adv_probability: 0.35    # p của bản related (augment): từ đúng → nhiễu ký tự, từ sai → sửa; cùng quy trình lúc train và test
twc_view: "shared"           # VQA và TWC dùng chung một lượt ViT5 encoder, cùng Origin + Related
twc_loss: "bce"              # bce = bản code TWA (t1); infonce = softmax trên mọi ứng viên
twc_feature: "fused"         # Origin ↔ Related lấy từ output ViT5 encoder sau khi fusion image/question/OCR
twc_queue_size: 0            # 0 = chỉ trong batch (t1); >0 = bộ nhớ cross-batch (cần infonce)
twc_queue_start: 1000        # số forward train trước khi đọc bộ nhớ
twc_mask_same_text: false    # false = nhãn TWA nguyên bản (t1); true = bỏ ứng viên trùng chữ khỏi negative
twc_objective: "lexical"     # cặp đối chiếu Origin ↔ Related; twc_feature quyết định vị trí lấy feature
twc_answer_weight: 0.1       # trọng số loss answer-grounded
twc_related_train: "correct" # chỉ dùng cho mode concat cũ; mode separate dùng ocr_related ở cả train/test

output_dir: "./output/finetune_aug_twc_consformer_fixed_tau02_trainable_templr1e5_wd01"
logging_dir: "./output/finetune_aug_twc_consformer_fixed_tau02_trainable_templr1e5_wd01/logs"
model_name_or_path: null # Optional OpenViVQA checkpoint; null initializes the backbones.
resume_from_checkpoint: null
resume_checkpoint_id: ""

seed: 42
num_train_epochs: 5
per_device_train_batch_size: 32
per_device_eval_batch_size: 32
gradient_accumulation_steps: 1   # batch hiệu dụng 32 = 32 x 1 trên một GPU
learning_rate: 0.0001                  # ViT5 và projection của adapter CLIP
new_module_learning_rate: 0.0001       # module OCR/ký tự khởi tạo ngẫu nhiên
scalar_learning_rate: 0.001            # gate adapter CLIP, không weight decay
twc_temperature_learning_rate: 0.00001 # riêng temperature TWC, áp dụng weight_decay bên dưới
weight_decay: 0.1
warmup_ratio: 0.1
lr_scheduler_type: "cosine"

logging_steps: 100
eval_strategy: "epoch"
save_strategy: "epoch"
save_total_limit: 2

# Đặt tự động theo dataset trong training/finetune.py: ViTextVQA/ViOCRVQA → em_f1
# (trung bình EM và F1 trên val), OpenViVQA → cider. Không chọn theo loss.
metric_for_best_model: "em_f1"
greater_is_better: true
load_best_model_at_end: true
remove_unused_columns: false
predict_with_generate: true

# 0 = CE thường, khớp công thức của run Vast cũ (code cũ bỏ qua giá trị này) để so sánh công bằng.
label_smoothing_factor: 0.1
optim: "adamw_torch"
dataloader_num_workers: 4
dataloader_pin_memory: true
disable_tqdm: false
fp16: false
report_to: "none"

generation_max_length: 56
generation_num_beams: 4
