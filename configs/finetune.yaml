dataset_name: "ViTextVQA"
data_dir: "./datasets"
# Công tắc module (notebook ghi đè qua biến môi trường): QA-ViT, Consformer, TWC.
ablation_use_image: true
ablation_use_qaclip: false   # QA-ViT: câu hỏi vào CLIP qua adapter học được · false = CLIP thường, không adapter
ablation_use_ocr: true       # Consformer (ConsFormer mã hoá chữ OCR) · false = embedding token ViT5
consformer_constituent: "tree"   # prior thành phần của ConsFormer như Tree Transformer / ViConsFormer (legacy = code cũ, prior ≈ 0)
consformer_residual: true        # chữ OCR = embedding token ViT5 + đầu ra ConsFormer (residual) · false = ConsFormer thay embedding
ocr_full_features: true      # mọi run đều có đặc trưng OCR: chữ + ký tự + box + det + rec (baseline cũng vậy)
ocr_feature_norm: "layernorm"   # chuẩn hoá từng luồng OCR như code trước refactor
# TWC như TWA: bản OCR related (tăng cường TWA = OCR Augmentation) đứng sau bản gốc trong input
# encoder, mỗi bản qua Consformer riêng; loss BCE hai chiều trên đầu ra encoder. Bản related có
# ở cả train và test (cùng quy trình); chỉ khi train mới có loss.
use_twc: false
twc_weight: 1.0
twc_adv_probability: 0.6     # TWA adv_pro: xác suất một từ của bản related bị đổi; notebook: TWC_AUG_P
twc_temperature_init: 0.1    # τ khởi tạo (học được; TWA 0.07); notebook: TWC_TAU
twc_eval_related: "none"     # bản related lúc val/test/predict: none = không có · correct = sửa 100% · augment = như lúc train
consformer_gate: false          # chữ OCR = embedding + g ⊙ ConsFormer, g = 0 lúc đầu (= không Consformer)
consformer_tree_transformer: false   # group attention như Tree Transformer: 1 cây mỗi lớp, chia d_model, vị trí sinusoid
twc_siglip: false               # TWC như SigLIP: logit = t·cos + b, BCE cộng theo hàng, trung bình theo hàng
twc_text_only: false            # TWC trên đặc trưng chữ (không box/det/rec), anchor = từ bị đổi
twc_text_labels: false          # cặp có cùng chuỗi chữ không làm cặp âm (bỏ qua)
qavit_gated_joint: false        # QA-ViT = CLIP + tanh(β)·(context joint-softmax − context CLIP); β = 0 = CLIP thường
qavit_ground: false             # loss: phần attention câu hỏi của patch rơi vào box OCR của đáp án
qavit_ground_weight: 0.1
consformer_span: false          # loss: mỗi span đáp án trong OCR là một constituent của ConsFormer
consformer_span_weight: 0.1
consformer_geometry: false      # link ConsFormer thấy bố cục box (bias khởi tạo 0)
consformer_word_link: false     # các mảnh subword của một từ OCR luôn nối (a = 1)
dove_contrastive: false         # loss NT-Xent giữa khối OCR của hai lượt DOVE (gốc / related), τ cố định
dove_contrastive_weight: 0.1
dove_temperature: 0.1
dove_adv: none                  # lượt DOVE thứ ba có nhiễu adversarial: none | fgsm (Surgical-VQLA++) | pgd (ATS)
dove_adv_eps: 0.05              # độ lớn nhiễu so với chuẩn của token bị nhiễu (hai paper không công bố)
dove_adv_steps: 2               # số điểm PGD K (pgd)
ocr_visual_pool: false          # token OCR += W·LN(đặc trưng patch CLIP dưới box), W = 0 lúc đầu
twc_two_views: true          # train: hai lượt encoder [gốc] và [related], loss trả lời trên cả hai, TWC giữa hai lượt; eval chỉ có [gốc]

output_dir: "./output/finetune"
logging_dir: "./output/finetune/logs"
model_name_or_path: null # Optional OpenViVQA checkpoint; null initializes the backbones.
resume_from_checkpoint: null
resume_checkpoint_id: ""

seed: 42
num_train_epochs: 5
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 1   # notebook: BATCH_SIZE, GRAD_ACCUM
learning_rate: 0.0001                  # phần đã pretrain (ViT5, projection của QA-ViT)
new_module_learning_rate: 0.0001       # module khởi tạo ngẫu nhiên (ConsFormer, embedding OCR/ký tự)
scalar_learning_rate: 0.001            # tham số vô hướng (temperature TWC, gate QA-ViT), không weight decay
weight_decay: 0.1
warmup_ratio: 0.1
lr_scheduler_type: "cosine"

logging_steps: 100
eval_strategy: "epoch"
save_strategy: "epoch"
save_total_limit: 2

# Đặt tự động theo dataset trong training/finetune.py: ViTextVQA/ViOCRVQA → em_f1
# (trung bình EM và F1 trên val), OpenViVQA → cider. Không chọn theo loss.
metric_for_best_model: "em_f1"
greater_is_better: true
load_best_model_at_end: true
remove_unused_columns: false
predict_with_generate: true

# 0 = CE thường, khớp công thức của run Vast cũ (code cũ bỏ qua giá trị này) để so sánh công bằng.
label_smoothing_factor: 0.1
optim: "adamw_torch"
dataloader_num_workers: 4
dataloader_pin_memory: true
disable_tqdm: false
fp16: false
report_to: "none"

generation_max_length: 56
generation_num_beams: 4
