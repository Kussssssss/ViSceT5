dataset_name: "ViTextVQA"
data_dir: "./datasets"
# ViSceT5 = CLIP không nhận câu hỏi + SceSpaVis + kênh sửa OCR (+ TWC khi use_twc=true).
ablation_use_image: true
ablation_use_qaclip: false   # dùng qavit_mode ở dưới
ablation_use_ocr: true
ablation_use_ocr_aug: true
ocr_related: "augment"         # bản related (dùng chung OCR-Aug, ConsFormer, TWC; train = test): augment = keep/correct/noise theo twc_adv_probability; correct = chỉ sửa
ocr_aug_mode: "lattice"       # lattice: ConsFormer chạy riêng bản gốc / bản related, token related chèn ngay sau từ gốc; concat: ghép 2 nửa 1 lượt
ocr_lattice_keep: "all"       # all: chèn đủ mọi từ của bản related; changed: chỉ từ bị đổi
# Công thức của run t1 (commit c6e2118, test EM 30.89): CLIP đóng băng hoàn toàn, RMSNorm,
# TWC TWA nguyên bản (BCE trên đầu ra encoder, related = tăng cường TWA), batch 8x1, LS 0.1.
qavit_mode: "off"   # off | no_question | question — CLIP thường (các run TWC t1–t11)
ocr_feature_norm: "layernorm"   # Consformer như code trước refactor (run Vast); rmsnorm = bản refactor
use_twc: false
twc_weight: 1.0
twc_temperature_init: 0.1    # τ khởi tạo (vẫn học được); 0.07 = CLIP/TWA
twc_adv_probability: 0.6     # p của bản related (augment): từ đúng → nhiễu ký tự, từ sai → sửa; cùng quy trình lúc train và test
twc_view: "separate"         # decoder luôn đọc bản sửa (như lúc test); TWC dùng bản tăng cường riêng qua một lượt encoder phụ
twc_loss: "bce"              # bce = bản code TWA (t1); infonce = softmax trên mọi ứng viên
twc_feature: "fused"          # như TWA: đầu ra ViT5 encoder tại vị trí OCR gốc / related; lexical = đặc trưng chữ trước encoder
twc_queue_size: 0            # 0 = chỉ trong batch (t1); >0 = bộ nhớ cross-batch (cần infonce)
twc_queue_start: 1000        # số forward train trước khi đọc bộ nhớ
twc_mask_same_text: false    # false = nhãn TWA nguyên bản (t1); true = bỏ ứng viên trùng chữ khỏi negative
twc_objective: "lexical"     # lexical: gốc ↔ related (TWA, t1) | answer: câu hỏi ↔ từ OCR của đáp án | both
twc_answer_weight: 0.1       # trọng số loss answer-grounded
twc_related_train: "correct" # bản related lúc train = bản sửa xác định như lúc test (đồng bộ train/test); twa = tăng cường TWA

output_dir: "./output/finetune"
logging_dir: "./output/finetune/logs"
model_name_or_path: null # Optional OpenViVQA checkpoint; null initializes the backbones.
resume_from_checkpoint: null
resume_checkpoint_id: ""

seed: 42
num_train_epochs: 5
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 1   # batch hiệu dụng 8 = 8 x 1 (t1)
learning_rate: 0.00003                 # phần đã pretrain (ViT5, projection của adapter CLIP)
new_module_learning_rate: 0.0001       # module khởi tạo ngẫu nhiên (ConsFormer, embedding OCR/ký tự): ~3x, như M4C/TWA
scalar_learning_rate: 0.001            # tham số vô hướng (temperature TWC, gate adapter), không weight decay
weight_decay: 0.1
warmup_ratio: 0.1
lr_scheduler_type: "cosine"

logging_steps: 100
eval_strategy: "epoch"
save_strategy: "epoch"
save_total_limit: 2

# Đặt tự động theo dataset trong training/finetune.py: ViTextVQA/ViOCRVQA → em_f1
# (trung bình EM và F1 trên val), OpenViVQA → cider. Không chọn theo loss.
metric_for_best_model: "em_f1"
greater_is_better: true
load_best_model_at_end: true
remove_unused_columns: false
predict_with_generate: true

# 0 = CE thường, khớp công thức của run Vast cũ (code cũ bỏ qua giá trị này) để so sánh công bằng.
label_smoothing_factor: 0.1
optim: "adamw_torch"
dataloader_num_workers: 4
dataloader_pin_memory: true
disable_tqdm: false
fp16: false
report_to: "none"

generation_max_length: 56
generation_num_beams: 4
