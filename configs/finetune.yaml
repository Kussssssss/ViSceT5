dataset_name: "ViTextVQA"
data_dir: "./datasets"
ablation_use_qaclip: true
ablation_use_ocr: true
use_ocr_aug_finetune: true

output_dir: "./output/finetune"
logging_dir: "./output/finetune/logs"
model_name_or_path: null # Optional OpenViVQA checkpoint; null initializes the backbones.
resume_from_checkpoint: null
resume_checkpoint_id: ""

seed: 42
num_train_epochs: 5
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 0.00003
weight_decay: 0.1
warmup_ratio: 0.1
lr_scheduler_type: "cosine"

logging_steps: 100
eval_strategy: "epoch"
save_strategy: "epoch"
save_total_limit: 4

metric_for_best_model: "loss"
greater_is_better: false
load_best_model_at_end: true
remove_unused_columns: false
predict_with_generate: true

label_smoothing_factor: 0.0
optim: "adamw_torch"
dataloader_num_workers: 4
dataloader_pin_memory: true
disable_tqdm: false
fp16: false
report_to: "none"

generation_max_length: 56
generation_num_beams: 4
