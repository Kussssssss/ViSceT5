dataset_name: ViTextVQA
data_dir: ./datasets
ablation_use_image: true
ablation_use_qaclip: false
ablation_use_ocr: true
ablation_use_consformer: true
ablation_use_ocr_aug: true
ocr_related: augment
ocr_aug_mode: separate
qavit_mode: no_question
ocr_feature_norm: layernorm
use_twc: true
twc_weight: 1.0
twc_temperature_init: 0.07
twc_temperature_min: 0.06
twc_adv_probability: 0.35
twc_view: shared
twc_loss: paper_bce
twc_feature: fused
twc_queue_size: 0
twc_queue_start: 1000
twc_mask_same_text: false
twc_objective: lexical
twc_answer_weight: 0.1
twc_related_train: correct
output_dir: ./output/twc_pretrain
logging_dir: ./output/twc_pretrain/logs
model_name_or_path: null
resume_from_checkpoint: null
resume_checkpoint_id: ''
seed: 42
num_train_epochs: 5
per_device_train_batch_size: 32
per_device_eval_batch_size: 32
gradient_accumulation_steps: 1
learning_rate: 0.0001
new_module_learning_rate: 0.0001
scalar_learning_rate: 0.001
twc_temperature_learning_rate: 1.0e-05
weight_decay: 0.1
warmup_ratio: 0.1
lr_scheduler_type: cosine
logging_steps: 100
eval_strategy: 'no'
save_strategy: epoch
save_total_limit: 2
metric_for_best_model: em_f1
greater_is_better: true
load_best_model_at_end: false
remove_unused_columns: false
predict_with_generate: false
label_smoothing_factor: 0.1
optim: adamw_torch
dataloader_num_workers: 4
dataloader_pin_memory: true
disable_tqdm: false
fp16: false
report_to: none
generation_max_length: 56
generation_num_beams: 4
stage: pretrain
input_order: question_last
twc_fixed_temperature: true
