  drive_id: '19lLeNbc3oUJ-u5ZywnAJoVCAZ3IHIibS'   # train-images/ (3.769) -> TRAIN
  extra:
    - drive_id: '1zyIu5AoKno26HQ_H1jVX3edBsBBKsYq_'   # public-test-images/ (558) -> VAL
